<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>ChatTPG</title>
  </head>
  <body class="bg-neutral-950 text-white overflow-x-hidden">
    <div class="container mx-auto max-w-3xl pb-40 px-2" id="chatcontainer">
      <!-- fixed area at the bottom ..   -->

      <div
        class="fixed inset-x-0 bottom-0 flex items-center justify-center bg-neutral-950"
      >
        <div class="bg-neutral-800 rounded-3xl mb-4 p-2 w-full max-w-3xl">
          <textarea
            class="w-full resize-none outline-0 p-3"
            rows="2"
            id="input"
          ></textarea>
          <div class="flex justify-end items-center">
            <button
              id="ask"
              class="bg-neutral-200 text-black rounded-full py-2 px-4 cursor-pointer hover:bg-gray-400"
            >
              ASK
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
